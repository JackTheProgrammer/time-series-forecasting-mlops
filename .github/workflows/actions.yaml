name: MLOps Time Series Retraining

on:
  push:
    branches: [ main ]
  schedule:
    # UCT time: 11:00 on the 1st day of every 4th month
    # Peshawar time: 16:00 p.m on the 1st day of every 4th month
    - cron: '0 11 1 */4 *' # Run automatically every 4 months on the 1st day at midnight
  
  # Allows manual triggering of the workflow from GitHub UI
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest # Runs on a clean cloud Linux VM

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Setup DVC
      uses: iterative/setup-dvc@v1

    - name: Pull Data from Remote Storage
      env:
        GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDS }} # Pulled securely from GitHub
      run: |
        dvc pull

    - name: Run Pipeline (Preprocessing & Training)
      run: |
        python scripts/preprocessing.py
        python scripts/dl_pipeline.py

    - name: Push New Artifacts to DVC
      run: |
        dvc add data models winner_models scaled_transform
        dvc push