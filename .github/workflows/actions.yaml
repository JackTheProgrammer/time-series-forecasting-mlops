name: MLOps Time Series Retraining

on:
  schedule:
    # UCT time: 11:00 on the 1st day of every 4th month
    # Peshawar time: 16:00 p.m on the 1st day of every 4th month
    - cron: "0 11 1 */4 *"

  # Allows manual triggering of the workflow from GitHub UI
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest # Runs on a clean cloud Linux VM

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup DVC
        uses: iterative/setup-dvc@v2

      - name: Pull Data from Remote Storage
        env:
          # The credentials for using google drive as DVC remote.
          GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDS }}
        run: |
          dvc init
          dvc remote add -d gdrive_remote gdrive://1Xo9n8s0l7m2a3b4c5d6e7f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8
          mkdir -p config
          echo $GDRIVE_CREDS > config/gdrive_creds.json
          # modifying the dvc remote to use the gdrive user credentials
          dvc remote modify gdrive_remote gdrive_use_credentials_file true
          # modifying the dvc remote to use the gdrive user credentials file
          dvc remote modify gdrive_remote gdrive_user_credentials_file config/gdrive_creds.json
          dvc pull -r gdrive_remote

      - name: Run Pipeline (Preprocessing & Training)
        run: |
          python scripts/preprocessing.py
          python scripts/dl_pipeline.py

      - name: Push New Artifacts to DVC
        run: |
          dvc add data 
          dvc add models 
          dvc add winner_models 
          dvc add scaled_transform
          dvc commit -f
          dvc push -r gdrive_remote
      
      - name: Upload DVC Artifacts for Dockerization
        uses: actions/upload-artifact@v7
        with:
          name: dvc-artifacts
          path: |
            data
            models
            winner_models
            scaled_transform
          retention-days: 1
      
      - name: Push to GitHub Repository
        run: |
          CURRENT_DATETIME=$(TZ="Asia/Karachi" date +"%Y-%m-%d %I:%M:%S %p")
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated retraining and artifact update at $CURRENT_DATETIME PKT. [skip ci]"
          git push origin main

  builds-daily-forecasting-image:
    runs-on: ubuntu-latest
    needs:
      - retrain

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setting up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker log in
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extracting meta data for the image
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/daily-forecasting

      - name: Build and push daily-forecasting latest image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: forecasts.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
