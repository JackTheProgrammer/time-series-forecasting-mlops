name: MLOps Time Series Retraining

on:
  schedule:
    # UTC time: 11:00 on the 1st day of every 4th month
    # Peshawar time: 16:00 p.m on the 1st day of every 4th month
    - cron: "0 11 1 */4 *"

  # Allows manual triggering of the workflow from GitHub UI
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest # Runs on a clean cloud Linux VM
    
    # GUARANTEED FIX: Injecting the credentials globally at the job level.
    # DVC native authentication listens to this exact environment variable name.
    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true # Crucial for pushing metadata changes back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup DVC
        uses: iterative/setup-dvc@v2

      - name: Pull Data from Remote Storage
        run: |
          # 1. Initialize dynamically if missing
          if [ ! -d ".dvc" ]; then
            echo "DVC directory not found. Initializing..."
            dvc init --no-scm
          fi

          # 2. Force add/overwrite the remote definition
          dvc remote add -d -f gdrive_remote gdrive://1Xo9n8s0l7m2a3b4c5d6e7f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8
          
          # 3. Pull data down (Authentication happens automatically in-memory via env)
          dvc pull -r gdrive_remote

      - name: Run Pipeline (Preprocessing & Training)
        run: |
          python scripts/preprocessing.py
          python scripts/dl_pipeline.py

      - name: Push New Artifacts to DVC
        run: |
          dvc add data 
          dvc add models 
          dvc add winner_models 
          
          # NOTE: Adjust the extension here to match exactly what preprocessing.py creates (e.g. .pkl, .joblib)
          # if it outputs a raw file or directory without extension, keep it as 'scaled_transform'
          if [ -f "scaled_transform.pkl" ]; then
            dvc add scaled_transform.pkl
          elif [ -d "scaled_transform" ] || [ -f "scaled_transform" ]; then
            dvc add scaled_transform
          fi
          
          dvc push

      - name: Upload DVC Artifacts for Dockerization
        uses: actions/upload-artifact@v7
        with:
          name: dvc-artifacts
          path: |
            data
            models
            winner_models
            scaled_transform*
          retention-days: 1

      - name: Push Tracking Metadata Back to GitHub Repository
        run: |
          CURRENT_DATETIME=$(TZ="Asia/Karachi" date +"%Y-%m-%d %I:%M:%S %p")
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage tracking file pointer changes along with auto-updated .gitignore rules
          git add data.dvc models.dvc winner_models.dvc scaled_transform*.dvc .gitignore
          
          # Only commit and push if metadata hashes actually changed
          if [ -n "$(git status --porcelain)" ]; then
            echo "New model mutations detected. Syncing tracking files to GitHub..."
            git commit -m "Automated retraining and artifact update at $CURRENT_DATETIME PKT. [skip ci]"
            # Fixes detached HEAD: Forces current commit state into the upstream remote branch pointer
            git push origin HEAD:main
          else
            echo "Model training yielded identical artifacts. Skipping Git push."
          fi

  builds-daily-forecasting-image:
    runs-on: ubuntu-latest
    needs:
      - retrain

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download DVC Artifacts
        uses: actions/download-artifact@v7
        with:
          name: dvc-artifacts
          path: . # Unpacks straight into the project root directory context

      - name: Setting up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker log in
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extracting meta data for the image
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/daily-forecasting
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push daily-forecasting latest image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: forecasts.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}